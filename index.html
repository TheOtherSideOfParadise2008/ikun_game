<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>只因大冒险</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>
  
  <!-- 👇 补全的死亡保存名字弹窗 -->
  <div id="nameBox" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.9); padding:30px; border:2px solid #ffd700; border-radius:10px; z-index:999; text-align:center; box-shadow:0 0 20px rgba(255,215,0,0.5);">
    <p style="color:#fff; font-family:monospace; font-size:20px; margin-top:0;">游戏结束！请输入你的大名：</p>
    <input id="playerNameInput" type="text" maxlength="10" value="无名氏" style="padding:8px; font-size:18px; text-align:center; margin-bottom:20px; border:none; outline:none; border-radius:4px;">
    <br>
    <button id="submitNameBtn" style="padding:8px 24px; font-size:18px; cursor:pointer; background:#ffd700; border:none; border-radius:4px; font-weight:bold; font-family:monospace;">保存战绩</button>
  </div>

  <!-- 1. 基础数据与音频 -->
  <script src="data.js"></script>
  <script src="audio.js"></script>
  
  <!-- 2. 实体与核心逻辑 -->
  <script src="player.js"></script>
  <script src="enemy.js"></script>
  <script src="boss.js"></script>
  
  <!-- 3. 技能与 UI (必须在 main.js 之前加载) -->
  <script src="skills/fantasy/kungfu/lightning_whip/learn.js"></script>
  <script src="skills/fantasy/kungfu/lightning_whip/effect.js"></script>
  <script src="ui.js"></script>
  <script src="level2.js"></script>
  
  <!-- 4. 主入口 (必须最后引入) -->
  <script src="main.js"></script>
</body>
</html>
